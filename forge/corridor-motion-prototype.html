<!doctype html><meta charset="utf-8"><title>ANIMUS Corridor</title><canvas id="c" width="960" height="540"></canvas><button onclick="run=!run">Run / idle</button><script>
let g=c.getContext('2d'),run=true;function draw(t){let p=t*.009*(run?1:0),z=t*.003*(run?1:0);g.fillStyle='#10141e';g.fillRect(0,0,960,540);g.strokeStyle='#65768b';for(let i=0;i<12;i++){let k=((i+z)%12+1)/12;g.strokeRect(480-470*k,240-235*k,940*k,470*k)}let y=260+8*Math.abs(Math.sin(p)),x=480;function limb(a,b,w){g.strokeStyle='#967052';g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}for(let s of [-1,1]){let q=Math.sin(p+s*Math.PI/2);limb([x+s*19,y+45],[x+s*22+q*25,y+105],28);limb([x+s*22+q*25,y+105],[x+s*22-q*30,y+165-Math.max(0,q)*30],19);limb([x+s*48,y-35],[x+s*55-q*20,y+10],23);limb([x+s*55-q*20,y+10],[x+s*45-q*30,y+40],15)}g.fillStyle='#967052';g.beginPath();g.ellipse(x,y,45,65,0,0,7);g.fill();g.fillStyle='#25232d';g.beginPath();g.ellipse(x,y-90,25,35,0,0,7);g.fill();for(let s of [-1,1]){g.beginPath();g.moveTo(x+s*10,y-110);g.lineTo(x+s*25,y-150);g.lineTo(x+s*24,y-105);g.fill();g.fillStyle='#c86aff';g.fillRect(x+s*12-4,y-94,8,4);g.fillStyle='#25232d'}g.fillStyle='white';g.font='16px monospace';g.fillText('ANIMUS / procedural gait preview',20,25);g.fillText('Phase '+(p%6.283).toFixed(2),20,48);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
